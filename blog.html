<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog &mdash; ShieldTech</title>
  <meta name="description" content="Insights, guides, and updates from ShieldTech on managed IT, cybersecurity, and small business technology.">
  <meta property="og:title" content="ShieldTech Blog">
  <meta property="og:description" content="Insights and guides from the ShieldTech team.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shieldtechus.com/blog">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #111210;
      --ink-soft: #3a3c38;
      --ink-quiet: #6e6f6a;
      --paper: #f5f2ec;
      --paper-tint: #efeae0;
      --rule: #d8d2c4;
      --accent: #2f4a3a;
      --accent-deep: #1c2e23;
      --gold: #d4a93c;
      --max: 1240px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 17px; line-height: 1.55;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    h1, h2, h3, h4 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400; letter-spacing: -0.01em; line-height: 1.05; margin: 0;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .container { max-width: var(--max); margin: 0 auto; padding: 0 32px; }

    /* Topbar (matches site) */
    .topbar {
      background: #111210;
      border-bottom: 1px solid rgba(245, 242, 236, 0.08);
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; max-width: var(--max); margin: 0 auto;
    }
    .topbar a { color: var(--paper); font-size: 14px; }
    .topbar .brand { font-family: "Fraunces", Georgia, serif; font-size: 20px; }
    .topbar nav a { margin-left: 24px; opacity: 0.8; transition: opacity 0.15s; }
    .topbar nav a:hover { opacity: 1; }

    /* Hero */
    .hero {
      padding: 80px 0 48px;
      border-bottom: 1px solid var(--rule);
    }
    .hero-eyebrow {
      font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--ink-quiet); margin-bottom: 16px;
    }
    .hero h1 {
      font-size: clamp(40px, 6vw, 72px);
      line-height: 1.02;
      margin-bottom: 16px;
    }
    .hero p {
      font-size: 19px; color: var(--ink-soft);
      max-width: 560px;
    }

    /* Posts grid */
    .posts-section {
      padding: 64px 0 96px;
    }
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 40px 32px;
    }
    .post-card {
      display: block;
      transition: transform 0.2s ease;
    }
    .post-card:hover { transform: translateY(-2px); }
    .post-card-image {
      aspect-ratio: 16 / 10;
      background: var(--paper-tint);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--rule);
    }
    .post-card-image img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .post-card:hover .post-card-image img { transform: scale(1.03); }
    .post-card-image.placeholder {
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-quiet);
      font-family: "Fraunces", Georgia, serif;
      font-size: 48px;
    }
    .post-card-meta {
      font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); font-weight: 500;
      margin-bottom: 10px;
    }
    .post-card-meta .sep { color: var(--ink-quiet); margin: 0 8px; }
    .new-badge {
      display: inline-block;
      padding: 3px 9px;
      background: var(--accent);
      color: var(--paper);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 999px;
      margin-right: 8px;
      vertical-align: middle;
    }
    .post-card h2 {
      font-size: 26px;
      margin-bottom: 12px;
    }
    .post-card-excerpt {
      color: var(--ink-soft);
      font-size: 16px;
      margin-bottom: 14px;
    }
    .post-card-foot {
      font-size: 13px; color: var(--ink-quiet);
      display: flex; align-items: center; gap: 10px;
    }
    .post-card-foot .date::before { content: "\u00B7"; margin-right: 10px; color: var(--rule); }

    /* Empty / loading */
    .state {
      text-align: center; padding: 80px 32px;
      color: var(--ink-quiet);
    }
    .state h2 {
      font-size: 32px; margin-bottom: 12px; color: var(--ink);
    }
    .spinner {
      width: 32px; height: 32px; margin: 0 auto 20px;
      border: 2px solid var(--rule);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Categories */
    .categories {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 48px;
    }
    .category-btn {
      padding: 8px 16px;
      border: 1px solid var(--rule);
      background: transparent;
      border-radius: 999px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-soft);
      cursor: pointer;
      transition: all 0.15s;
    }
    .category-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .category-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--paper);
    }

    /* Footer */
    .footer {
      border-top: 1px solid var(--rule);
      padding: 40px 0;
      color: var(--ink-quiet);
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .container { padding: 0 24px; }
      .hero { padding: 56px 0 32px; }
      .posts-section { padding: 40px 0 64px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">ShieldTech</a>
      <nav>
        <a href="/">Home</a>
        <a href="/blog">Blog</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <div class="hero-eyebrow">The ShieldTech Blog</div>
      <h1>Notes from the field.</h1>
      <p>Plain-language writing on managed IT, cybersecurity, and how small businesses keep their tech humming.</p>
    </div>
  </section>

  <section class="posts-section">
    <div class="container">
      <div class="categories" id="categories"></div>
      <div id="posts-root">
        <div class="state">
          <div class="spinner"></div>
          <p>Loading posts...</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      &copy; <span id="year"></span> ShieldTech. All rights reserved.
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
    import {
      getFirestore, collection, query, where, getDocs
    } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyB5Obt0I7-e_XGRSXoj69RwhjeR1071P3I",
      authDomain: "cyberpulse-f29eb.firebaseapp.com",
      projectId: "cyberpulse-f29eb",
      storageBucket: "cyberpulse-f29eb.firebasestorage.app",
      messagingSenderId: "375810495528",
      appId: "1:375810495528:web:7a1f99e9e2efc9b38a911d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('year').textContent = new Date().getFullYear();

    const root = document.getElementById('posts-root');
    const categoriesEl = document.getElementById('categories');

    let allPosts = [];
    let activeCategory = 'all';

    function formatDate(ts) {
      if (!ts) return '';
      let d;
      if (ts.toDate) d = ts.toDate();
      else if (ts.seconds) d = new Date(ts.seconds * 1000);
      else if (typeof ts === 'string') d = new Date(ts);
      else return '';
      if (isNaN(d)) return '';
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function isNew(post) {
      const ts = (post.publishedAt?.toMillis?.() || post.updatedAt?.toMillis?.() || 0);
      if (!ts) return false;
      return Date.now() - ts < 7 * 24 * 60 * 60 * 1000;
    }

    function escapeHTML(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function renderPosts() {
      const list = activeCategory === 'all'
        ? allPosts
        : allPosts.filter(p => p.category === activeCategory);

      if (list.length === 0) {
        root.innerHTML = `
          <div class="state">
            <h2>No posts yet</h2>
            <p>Check back soon — we're working on something good.</p>
          </div>`;
        return;
      }

      root.innerHTML = `<div class="posts-grid">${list.map(p => {
        const title = escapeHTML(p.title);
        const excerpt = escapeHTML(p.excerpt || (p.body || '').slice(0, 200));
        const category = escapeHTML(p.category || 'General');
        const author = escapeHTML(p.authorName || 'ShieldTech');
        const date = formatDate(p.publishedAt || p.updatedAt || p.createdAt);
        const slug = encodeURIComponent(p.slug || p.id);
        const img = p.featuredImageUrl
          ? `<img src="${escapeHTML(p.featuredImageUrl)}" alt="${title}" loading="lazy" onerror="this.parentElement.classList.add('placeholder');this.remove();this.parentElement.textContent='\u25E6';">`
          : '\u25E6';
        const imgClass = p.featuredImageUrl ? 'post-card-image' : 'post-card-image placeholder';
        return `
          <a href="/post.html?slug=${slug}" class="post-card">
            <div class="${imgClass}">${img}</div>
            <div class="post-card-meta">${isNew(p) ? '<span class="new-badge">New</span>' : ''}${category}</div>
            <h2>${title}</h2>
            <p class="post-card-excerpt">${excerpt}${excerpt.length >= 200 ? '...' : ''}</p>
            <div class="post-card-foot">
              <span>${author}</span>
              ${date ? `<span class="date">${date}</span>` : ''}
            </div>
          </a>`;
      }).join('')}</div>`;
    }

    function renderCategories() {
      const cats = new Set(allPosts.map(p => p.category).filter(Boolean));
      const sorted = ['all', ...Array.from(cats).sort()];
      categoriesEl.innerHTML = sorted.map(c =>
        `<button class="category-btn ${activeCategory === c ? 'active' : ''}" data-cat="${escapeHTML(c)}">${c === 'all' ? 'All' : escapeHTML(c)}</button>`
      ).join('');
      categoriesEl.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          renderCategories();
          renderPosts();
        });
      });
    }

    async function loadPosts() {
      try {
        const qy = query(collection(db, 'blogPosts'), where('published', '==', true));
        const snap = await getDocs(qy);
        allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        allPosts.sort((a, b) => {
          const aT = (a.publishedAt?.toMillis?.() || a.updatedAt?.toMillis?.() || 0);
          const bT = (b.publishedAt?.toMillis?.() || b.updatedAt?.toMillis?.() || 0);
          return bT - aT;
        });
        renderCategories();
        renderPosts();
      } catch (err) {
        console.error(err);
        root.innerHTML = `
          <div class="state">
            <h2>Couldn't load posts</h2>
            <p>${escapeHTML(err.message)}</p>
          </div>`;
      }
    }

    loadPosts();
  </script>

</body>
</html>
