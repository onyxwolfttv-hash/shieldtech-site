<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">Loading post... — ShieldTech</title>
  <meta name="description" id="meta-description" content="">
  <meta property="og:title" id="og-title" content="">
  <meta property="og:description" id="og-description" content="">
  <meta property="og:type" content="article">
  <meta property="og:image" id="og-image" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #111210;
      --ink-soft: #3a3c38;
      --ink-quiet: #6e6f6a;
      --paper: #f5f2ec;
      --paper-tint: #efeae0;
      --rule: #d8d2c4;
      --accent: #2f4a3a;
      --accent-deep: #1c2e23;
      --gold: #d4a93c;
      --max: 760px;
      --max-wide: 1240px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 17px; line-height: 1.55;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    h1, h2, h3, h4 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400; letter-spacing: -0.01em; line-height: 1.05; margin: 0;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .container { max-width: var(--max); margin: 0 auto; padding: 0 32px; }
    .container-wide { max-width: var(--max-wide); margin: 0 auto; padding: 0 32px; }

    /* Topbar */
    .topbar {
      background: #111210;
      border-bottom: 1px solid rgba(245, 242, 236, 0.08);
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; max-width: var(--max-wide); margin: 0 auto;
    }
    .topbar a { color: var(--paper); font-size: 14px; }
    .topbar .brand { font-family: "Fraunces", Georgia, serif; font-size: 20px; }
    .topbar nav a { margin-left: 24px; opacity: 0.8; transition: opacity 0.15s; }
    .topbar nav a:hover { opacity: 1; }

    /* Back link */
    .back-bar {
      padding: 24px 0 0;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--ink-soft);
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent); }

    /* Header */
    .post-header {
      padding: 32px 0 40px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 40px;
    }
    .post-category {
      font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--accent); font-weight: 500;
      margin-bottom: 20px;
    }
    .post-title {
      font-size: clamp(36px, 5vw, 56px);
      line-height: 1.05;
      margin-bottom: 24px;
    }
    .post-meta {
      display: flex; gap: 16px; flex-wrap: wrap;
      color: var(--ink-quiet); font-size: 14px;
    }
    .post-meta .sep { color: var(--rule); }

    /* Featured image */
    .featured-image {
      max-width: var(--max-wide);
      margin: 0 auto 56px;
      padding: 0 32px;
    }
    .featured-image img {
      width: 100%;
      max-height: 540px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--rule);
    }

    /* Body */
    .post-body {
      font-size: 19px;
      line-height: 1.75;
      color: var(--ink);
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .post-body p { margin: 0 0 24px; }

    /* Tags */
    .post-tags {
      padding: 40px 0;
      margin-top: 56px;
      border-top: 1px solid var(--rule);
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .tag {
      padding: 6px 12px;
      background: var(--paper-tint);
      border: 1px solid var(--rule);
      border-radius: 999px;
      font-size: 12px;
      color: var(--ink-soft);
    }

    /* Author card */
    .author-card {
      padding: 32px;
      background: var(--paper-tint);
      border: 1px solid var(--rule);
      border-radius: 6px;
      margin: 24px 0 80px;
      display: flex; align-items: center; gap: 20px;
    }
    .author-avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      font-family: "Fraunces", Georgia, serif;
      font-size: 22px;
      flex-shrink: 0;
    }
    .author-name {
      font-weight: 500;
      font-size: 16px;
      margin-bottom: 2px;
    }
    .author-role {
      font-size: 13px;
      color: var(--ink-quiet);
    }

    /* States */
    .state {
      text-align: center; padding: 120px 32px;
      color: var(--ink-quiet);
    }
    .state h2 {
      font-size: 36px; margin-bottom: 16px; color: var(--ink);
    }
    .state a {
      color: var(--accent);
      text-decoration: underline;
    }
    .spinner {
      width: 32px; height: 32px; margin: 0 auto 20px;
      border: 2px solid var(--rule);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .footer {
      border-top: 1px solid var(--rule);
      padding: 40px 0;
      color: var(--ink-quiet);
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .container, .container-wide { padding: 0 24px; }
      .featured-image { padding: 0 24px; margin-bottom: 32px; }
      .post-body { font-size: 17px; line-height: 1.65; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">ShieldTech</a>
      <nav>
        <a href="/">Home</a>
        <a href="/blog">Blog</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="back-bar">
      <a href="/blog" class="back-link">&larr; All posts</a>
    </div>
  </div>

  <article id="post-root">
    <div class="state">
      <div class="spinner"></div>
      <p>Loading post...</p>
    </div>
  </article>

  <footer class="footer">
    <div class="container-wide">
      &copy; <span id="year"></span> ShieldTech. All rights reserved.
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
    import {
      getFirestore, collection, query, where, getDocs, doc, updateDoc, increment
    } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyB5Obt0I7-e_XGRSXoj69RwhjeR1071P3I",
      authDomain: "cyberpulse-f29eb.firebaseapp.com",
      projectId: "cyberpulse-f29eb",
      storageBucket: "cyberpulse-f29eb.firebasestorage.app",
      messagingSenderId: "375810495528",
      appId: "1:375810495528:web:7a1f99e9e2efc9b38a911d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('year').textContent = new Date().getFullYear();

    const root = document.getElementById('post-root');

    function escapeHTML(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function formatDate(ts) {
      if (!ts) return '';
      let d;
      if (ts.toDate) d = ts.toDate();
      else if (ts.seconds) d = new Date(ts.seconds * 1000);
      else if (typeof ts === 'string') d = new Date(ts);
      else return '';
      if (isNaN(d)) return '';
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function getSlugFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('slug');
    }

    function renderNotFound() {
      root.innerHTML = `
        <div class="state">
          <h2>Post not found</h2>
          <p>This post doesn't exist or has been unpublished. <a href="/blog">Back to all posts</a>.</p>
        </div>`;
      document.getElementById('page-title').textContent = 'Post not found — ShieldTech';
    }

    function renderError(msg) {
      root.innerHTML = `
        <div class="state">
          <h2>Something went wrong</h2>
          <p>${escapeHTML(msg)} <a href="/blog">Back to all posts</a>.</p>
        </div>`;
    }

    function renderPost(post) {
      const title = escapeHTML(post.title);
      const category = escapeHTML(post.category || 'General');
      const author = escapeHTML(post.authorName || 'ShieldTech');
      const date = formatDate(post.publishedAt || post.updatedAt || post.createdAt);
      const body = escapeHTML(post.body || '');
      const excerpt = post.excerpt || (post.body || '').slice(0, 160);
      const authorInitial = (post.authorName || 'S').charAt(0).toUpperCase();

      // Update meta tags
      document.getElementById('page-title').textContent = `${post.title} — ShieldTech`;
      document.getElementById('meta-description').setAttribute('content', excerpt);
      document.getElementById('og-title').setAttribute('content', post.title);
      document.getElementById('og-description').setAttribute('content', excerpt);
      if (post.featuredImageUrl) {
        document.getElementById('og-image').setAttribute('content', post.featuredImageUrl);
      }

      const tagsHtml = Array.isArray(post.tags) && post.tags.length > 0
        ? `<div class="container"><div class="post-tags">${
            post.tags.map(t => `<span class="tag">${escapeHTML(t)}</span>`).join('')
          }</div></div>`
        : '';

      const imageHtml = post.featuredImageUrl
        ? `<div class="featured-image"><img src="${escapeHTML(post.featuredImageUrl)}" alt="${title}"></div>`
        : '';

      root.innerHTML = `
        <header class="container">
          <div class="post-header">
            <div class="post-category">${category}</div>
            <h1 class="post-title">${title}</h1>
            <div class="post-meta">
              <span>${author}</span>
              ${date ? `<span class="sep">|</span><span>${date}</span>` : ''}
            </div>
          </div>
        </header>
        ${imageHtml}
        <div class="container">
          <div class="post-body">${body}</div>
          <div class="author-card">
            <div class="author-avatar">${escapeHTML(authorInitial)}</div>
            <div>
              <div class="author-name">${author}</div>
              <div class="author-role">ShieldTech Team</div>
            </div>
          </div>
        </div>
        ${tagsHtml}
      `;

      // Best-effort view count increment
      try {
        updateDoc(doc(db, 'blogPosts', post.id), { viewCount: increment(1) }).catch(() => {});
      } catch (_) {}
    }

    async function loadPost() {
      const slug = getSlugFromUrl();
      if (!slug) {
        renderNotFound();
        return;
      }

      try {
        const qy = query(
          collection(db, 'blogPosts'),
          where('slug', '==', slug),
          where('published', '==', true)
        );
        const snap = await getDocs(qy);
        if (snap.empty) {
          renderNotFound();
          return;
        }
        const docSnap = snap.docs[0];
        renderPost({ id: docSnap.id, ...docSnap.data() });
      } catch (err) {
        console.error(err);
        renderError(err.message);
      }
    }

    loadPost();
  </script>

</body>
</html>
